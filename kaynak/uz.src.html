<style>
/* Düzen: sol menü (profil + adımlar) · sağda seçili ekran. event360 tasarım dili: beyaz→buz mavisi, mürekkep lacivert, organizasyon rengi. */
:root{
 --bg:#f3f7fc;--bg2:#fbfdff;--card:#ffffff;--ink:#0b2545;--ink2:#33465c;--mut:#5f7186;--line:#e2eaf3;--line2:#edf2f8;
 --rc:#2b8fb8;--rc2:#1f6fc5;--soft:#e8f4fa;--ok:#139a83;--okb:#e3f5f1;--wr:#c27a12;--wrb:#fdf3e2;--bad:#c4473a;--badb:#fcebe8;
 --sh1:0 1px 2px rgba(16,42,80,.04),0 2px 6px -2px rgba(16,42,80,.06);--sh2:0 1px 2px rgba(16,42,80,.05),0 12px 30px -14px rgba(16,42,80,.2);
 --f-d:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1522;--bg2:#0f1c2c;--card:#122236;--ink:#e6eef8;--ink2:#c3d1e1;--mut:#8ea2b8;--line:#22364d;--line2:#1a2c41;--rc:#4fb3dc;--rc2:#5a9be6;--soft:#14324a;--ok:#3cc9ad;--okb:#123a35;--wr:#e6a64a;--wrb:#3a2d16;--bad:#ec7a6d;--badb:#3d1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1522;--bg2:#0f1c2c;--card:#122236;--ink:#e6eef8;--ink2:#c3d1e1;--mut:#8ea2b8;--line:#22364d;--line2:#1a2c41;--rc:#4fb3dc;--rc2:#5a9be6;--soft:#14324a;--ok:#3cc9ad;--okb:#123a35;--wr:#e6a64a;--wrb:#3a2d16;--bad:#ec7a6d;--badb:#3d1f1c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-d);color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.ik{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;--ik:var(--rc)}
.ik .a{stroke:var(--ik)}.ik .af{stroke:var(--ik);fill:var(--ik);fill-opacity:.16}
.ik-16{width:16px;height:16px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* Sol menü */
.sb{background:linear-gradient(180deg,var(--card),var(--bg2));border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 10px}
.logo{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.logo .ik{width:26px;height:26px;color:var(--rc2)}
.logo b{color:var(--rc2)}
.ver{margin-left:auto;font:600 .7rem var(--f-m);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut);background:var(--card);cursor:pointer}
.prof{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line2);border-radius:12px;background:var(--card);margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;font-weight:700;font-size:.85rem;flex:none}
.rolsel{display:grid;gap:3px;margin:-4px 0 12px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.rolsel select{width:100%;font-size:.82rem;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)}
.rk{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:700;white-space:nowrap;border:1px solid currentColor;background:var(--card)}.rk button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;font-weight:700}
.flow{list-style:none;margin:0;padding:0;counter-reset:f}.flow li{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;padding:9px 0 9px 26px;border-bottom:1px solid var(--line2)}.flow li:last-child{border:0}.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:0;top:10px;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--rc);font-size:.68rem;font-weight:800;display:grid;place-items:center}.flow li.on::before{background:var(--rc);color:#fff}.flow b{font-size:.86rem}.flow .h{font-size:.8rem;color:var(--ink2)}
@media (max-width:640px){.flow li{grid-template-columns:1fr}}
.prof b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prof small{display:block;color:var(--rc);font-weight:600;font-size:.72rem}.prof span{font-size:.7rem;color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--rc)}
.nav a .n{margin-left:auto;font:600 .7rem var(--f-m);color:var(--mut)}
.nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;gap:1px;padding-right:2px}
.nav a{padding:6px 10px;gap:9px;font-size:.86rem}.nav a .ik{width:17px;height:17px}
.nav .sep{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;font-family:inherit;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:9px 10px 4px;font-weight:700;text-align:left;border-radius:8px}
.nav .sep:hover{color:var(--ink)}
.nav .sep .nc{margin-left:auto;font:600 .66rem var(--f-m);letter-spacing:0;background:var(--soft);border-radius:999px;padding:0 6px;color:var(--ink2)}
.nav .sep .cv{width:12px;height:12px;flex:none;transition:transform .18s}
.nav .sep[aria-expanded=false] .cv{transform:rotate(-90deg)}
.nav .sep.act{color:var(--rc2)}
.navh{flex:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}.navh a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.86rem;position:relative}.navh a .ik{width:17px;height:17px}.navh a:hover{background:var(--soft)}.navh a.on{background:var(--soft);color:var(--ink);font-weight:700}.navh a.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--rc)}
.nav .ng{display:flex;flex-direction:column;gap:1px}.nav .ng[hidden]{display:none}
/*NAVRENK*/
.nav{--g:var(--rc)}
.nav .gp1{--g:#2f6fd0;--gt:#1d4f9e}.nav .gp5{--g:#12908a;--gt:#0b6662}.nav .gp4{--g:#7c5cc4;--gt:#5a3ca0}.nav .gp2{--g:#d4811a;--gt:#9a5a0a}.nav .gp3{--g:#cc4777;--gt:#a02755}.nav .gp6{--g:#5b9a2a;--gt:#3f7016}
:root[data-theme="dark"] .nav .gp1,:root[data-theme="dark"] .nav .gp5,:root[data-theme="dark"] .nav .gp4,:root[data-theme="dark"] .nav .gp2,:root[data-theme="dark"] .nav .gp3,:root[data-theme="dark"] .nav .gp6{--gt:var(--g)}
:root[data-theme="dark"] .nav .gp1{--g:#6aa0f0}:root[data-theme="dark"] .nav .gp5{--g:#3cc7bf}:root[data-theme="dark"] .nav .gp4{--g:#a58cf0}:root[data-theme="dark"] .nav .gp2{--g:#f0a548}:root[data-theme="dark"] .nav .gp3{--g:#f27ea6}:root[data-theme="dark"] .nav .gp6{--g:#8fcf5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav .gp1{--g:#6aa0f0;--gt:#6aa0f0}:root:not([data-theme="light"]) .nav .gp5{--g:#3cc7bf;--gt:#3cc7bf}:root:not([data-theme="light"]) .nav .gp4{--g:#a58cf0;--gt:#a58cf0}:root:not([data-theme="light"]) .nav .gp2{--g:#f0a548;--gt:#f0a548}:root:not([data-theme="light"]) .nav .gp3{--g:#f27ea6;--gt:#f27ea6}:root:not([data-theme="light"]) .nav .gp6{--g:#8fcf5a;--gt:#8fcf5a}}
.nav button.sep{margin-top:10px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--g) 11%,transparent);color:var(--gt,var(--g));font-size:.68rem;letter-spacing:.08em;border:1px solid color-mix(in srgb,var(--g) 22%,transparent);position:relative}
.nav button.sep:first-of-type{margin-top:4px}
.nav button.sep::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--g);flex:none;order:-1}
.nav button.sep:hover{background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--gt,var(--g))}
.nav button.sep .nc{background:var(--g);color:#fff;font-weight:700;min-width:20px;text-align:center}
:root[data-theme="dark"] .nav button.sep .nc{color:#0b1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button.sep .nc{color:#0b1522}}
.nav button.sep.act{background:color-mix(in srgb,var(--g) 20%,transparent);border-color:color-mix(in srgb,var(--g) 45%,transparent)}
.nav .ng{margin:3px 0 0 8px;padding:2px 0 2px 6px;border-left:2px solid color-mix(in srgb,var(--g) 35%,transparent)}
.nav .ng a .ik{color:var(--g)}
.nav .ng a:hover{background:color-mix(in srgb,var(--g) 9%,transparent)}
.nav .ng a.on{background:color-mix(in srgb,var(--g) 17%,transparent);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 30%,transparent)}
.nav .ng a.on::before{left:-8px;top:4px;bottom:4px;width:4px;background:var(--g)}
.nav .ng a.on .ik{stroke-width:2.1}
.nav a.on{background:color-mix(in srgb,var(--rc) 15%,transparent)}
.navh a.on{background:color-mix(in srgb,var(--rc) 15%,transparent);font-weight:800}

.prof{padding:8px 10px;margin-bottom:8px}.rolsel{margin:-2px 0 8px}.logo{padding-bottom:8px}
@media (max-height:760px){.sbf{display:none}}
.sbf{margin-top:auto;font-size:.7rem;color:var(--mut);padding:10px 8px 0;border-top:1px solid var(--line2);line-height:1.5}
/* Üst çubuk */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 24px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{color:var(--mut);font-size:.82rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--ink)}
.priv{font-size:.72rem;color:var(--ok);background:var(--okb);border-radius:999px;padding:3px 9px;font-weight:600;white-space:nowrap}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}

.ph .bx .ik{--ik:#fff;color:#fff}
.ph h1{margin:0;font-size:1.5rem;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 18px;font-size:.88rem;max-width:72ch}
/* Bileşenler */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);padding:16px 18px;min-width:0}

.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}.ch>div{min-width:0}.ch .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.sel td{background:var(--soft)}

.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--rc)}

.money b{font-variant-numeric:tabular-nums;font-size:.92rem}
.pos{color:var(--ok)}

const CHANGES=[['UZ-v27','27.11.2026','Etkinlik planlama etkileşimli: aşamalar aynı sayfada alt alta; hedef, tarih, mekân, katılımcı, program ve lojistik seçimleri dokunarak yapılır; bütçe ve takvim canlı hesaplanır; plan Teklif, Görevler ve Gün akışına aktarılır.'],['UZ-v26','27.11.2026','Etkinlik planlama eğitim amaçlı: 8 aşama aynı sayfada alt alta; başka ekrana gitmeden her aşamada ne yapılır, kim sorumlu, kontrol listesi ve örnek cevap burada okunur.'],['UZ-v25','27.11.2026','Örnek etkinlik planlama sadeleştirildi: 8 aşama, her aşama açılır kutu; içinde kısa sorular, her sorunun kısa örnek cevabı ve ilgili ekrana git düğmesi. Etkinlik seçici, KPI kartları ve ayrıntı kalabalığı kaldırıldı.'],['UZ-v24','27.11.2026','Örnek etkinlik planlama: yeni ekran Etkinlik planı (Satış ve hazırlık, Etkinlikler’in altında). 8 aşama, 17 soru (neden, kim öder, maliyet ve fiyat, tarih ve mekân, alan, davet, rıza, sponsor, gün akışı, eşleştirme, lojistik, gezi-rehber-sağlık, numune, duyuru, etkinlik günü, sonuç, 12 ay takip); her soruda sorumlu rol ve ilgili ekrana bağ. Örnek etkinlik seçici (Gıda, Tekstil, Makine, İnşaat): cevaplar etkinliğin aşamasına göre dolar veya bekler. Tutarlar yalnız patrona açık.'],['UZ-v23','27.11.2026','Akışlar ve modül yapısı: rolün açamadığı ekrana giden bağlar kilitli çip olur; eşleştirme veya masa değişince B2B programı için Yeniden aktar uyarısı; Teklif seçili modüllerin giderlerini alır; kiosk kayıt listesi eşleştirmeden yenilenir; rol matrisi genişledi ve Ekip ve roller ekranına Rol × modül matrisi geldi; tüm ekranlarda kartlar cam görünümlü ve açılır; başlık ve düğmelere otomatik ikon; Fiyat ve tarifeler’e ayrı ikon.'],['UZ-v22','20.11.2026','Menü grupları renkle ayrıldı: her modül grubunun kendi rengi (başlık, ikon, ayırıcı çizgi) ve aktif ekran için belirgin seçim vurgusu. İşlev değişmedi.'],['UZ-v21','20.11.2026','Sol menü sırası: Kullanım rehberi iş akışı gruplarının dışına alındı; menünün en altında, sabit "Yardım" satırı olarak her zaman görünür. Satış ve hazırlık → Lojistik ve gezi → Yayın ve tanıtım → Etkinlik günü → Sonuç sırası korundu. İşlev değişmedi.'],['UZ-v20','20.11.2026','Sol menü kompakt: modül grupları katlanır (başlığa basınca açılır/kapanır, grup başında ekran sayısı), aktif ekranın grubu kendiliğinden açık, menü kendi içinde kaydırılır, satırlar sıkılaştırıldı. İşlev değişmedi.'],['UZ-v19','20.11.2026','Kompakt düzen: uzun ekranlarda kartlar açılır kutu olur (başlığa veya oka basınca açılır/kapanır, Tümünü aç/kapat), kart içi alt bölümler de açılır; rehber adımları tek satır; mobilde KPI kartları 2 sütun. İşlev değişmedi.'],['UZ-v18','19.11.2026','Etkinlik günü araçları (gerçek bir forumdaki masadan): Mekân ve tercüman ekranında simültane kulaklık envanteri: 60 numaralı alıcı, dil kanalı (00 salon, 01 TR, 02 RU, 03 EN, 04 UZ), kime verildi, iade al, kayıp yaz; eksikler kırmızı, kiralama ve kayıp bedeli Finans’a. Kiosk ekranında basılı imza listesi: kayıtlı isimler alfabetik ve numaralı, telefon, kulaklık no, kioskta okutanlar K ile; sonda boş satırlar; 4 dilde PDF. Sonradan aktar: el yazısı satırlar girilir, kayıtlı kişi Geldi olur, yeni kişi katılıma eklenir. Heyet kataloğunda 4 dilli ürün/firma QR kartları (Katalog için okutun), A4’e 4 kesim çizgili, okutma testi. Bülten ekranında davetiye (A5, Telegram bot QR’lı) ve kayıt QR afişi (A4, 4 dil). Alan planında elle çizilen kroki fotoğrafı ve kurulum listesine kulaklık masası, imza listesi, QR kartlar. Görevlerde elle yapılacak işler planı (T-14 → T+7) ve 6 yeni görev.'],['UZ-v17','19.11.2026','Etkinlik sonrası 12 aylık takip: etkinlik Sonuç aşamasına geçince her B2B eşleşmesi (TR firma ↔ Özbek alıcı) için 12 aylık plan kendiliğinden açılır (1. ay teşekkür, 3/6/9/12. ay arama, aralarda kısa kontrol). Aylık hatırlatma: Bu ay aranacaklar ve gecikenler Sonuç ve takip, Ana sayfa, Görevler ve Çağrı merkezinde; sorumluya Telegram + e-posta (taklit). Temas kaydı (arama, mesaj, online görüşme, ziyaret, numune, teklif, sipariş), sonraki adım ve tarih, sorumlu, sıcak/ılık/soğuk. Sonuç türleri: temsilcilik açma, distribütörlük, satış/sipariş, şirket kurulumu, ortak girişim, numune/deneme, sonuç yok, diğer (serbest metin); her birinde tarih, tutar, not ve sonraki adım. 6. ve 12. ay anketi. 4 dilde takip mesajı şablonu. Firma bazlı 12 aylık zaman çizgisi. Pano ve Raporlarda dönüşüm hunisi ve sonuç türü dağılımı (12 ay takip raporu PDF/Excel).'],['UZ-v16','19.11.2026','Alan planı: fuaye, kongre salonu, salon B ve yemek alanı krokisi; şablon (karşılama, tiyatro, sınıf, U, yuvarlak masa, B2B) + sürükle-bırak; 3D görünüm (döndür, yakınlaş); kapasite gün akışıyla karşılaştırılır, çakışma ve acil çıkış kontrolü; backdrop, roll-up, kapı tabelası, QR standı, bayrak, B2B masa seti, sahne, ekran ve tercüman kabini malzeme listesi (baskı dili, tedarikçi, sipariş); Alan kurulumu ve baskı gideri teklife ve finansa geçer; kurulum kontrol listesi görevli panosuna gider; alan planı PDF 4 dilde.'],['UZ-v15','18.11.2026','Fiyat ve tarifeler: tercüman ve rehber günlüğü, otel gece fiyatı, restoran kişi başı, ulaşım sefer fiyatı, salon ve oturum kirası, kiosk, baskı, giriş kartı, ikram, konuşmacı, gezi giriş ve tren bileti, sağlık paketi, B2B paket payı ve kâr payı ekrandan değiştirilir. Lojistik, Mekân, Rehber ve sağlık ekranlarında fiyatın yanında ✎ ile satır içi düzenleme. Fiyat değişince gider, teklif, finans (tedarikçi ödemesi, hak ediş, verilen teklif) ve pano anında yeniden hesaplanır; onaylı teklifin fiyatı değişirse yeniden onay ister. Kâr payı, satış fiyatı ve paket payı yalnız yöneticide; Lojistik tedarikçi fiyatını girer, toplam ve kârı görmez. Son değişiklikler kaydı.'],['UZ-v14','18.11.2026','Kullanım rehberi videoları ve adımları UZ-v13 görünümüne göre yenilendi: seçimler artık açılır kutudan (Teklif, Çağrı merkezi, Program PDF firma ve dil, Mekân tercüman, Gezi yer ve şehir, Katalog, Bülten, Medya, Raporlar). Sıra aynı.'],['UZ-v13','18.11.2026','Tüm seçimler tek tip açılır kutu; 8 ve üstü seçenekte arama. Program PDF’te firma seçimi, Görevlerde sorumlu atama, Mekân’da tercüman ↔ masa kutusu, etkinlik formunda müşteri/kuruluş (yeni ad eklenebilir), kioskta aramalı firma seçimi; dosya dili, şehir, platform, şablon/kanal ve rapor kırılımı kutuya alındı.'],['UZ-v12','18.11.2026','Kullanım rehberi iş akışı sırasıyla: firma bilgilerinin girişinden (Firma evreni) başlar; Hazırlık ve satış → Davet ve kayıt → Program → Lojistik ve gezi → Yayın → Etkinlik günü → Sonuç ve para, 24 numaralı adım + her gün kullanılan 3 ekran. Her adımda sorumlu rol, rolünüzün adımları vurgulu; ayrı rehber sayfası da aynı sırada (Yalnız rolümün adımları filtresi).'],['UZ-v11','18.11.2026','Kullanım rehberi: menüde yeni ekran (rolünüzün ekranları, her biri video + adımlar) ve her ekranın üst çubuğunda ? butonu (o ekranın adımları + videosu). 27 ekranın videosu ayrı rehber sayfasında, rol bazlı ve iş akışı sırasıyla.'],['UZ-v10','17.11.2026','Ekip ve roller: 8 rol (Yönetici/patron, Satış ve teklif, Çağrı merkezi, Program, Lojistik ve gezi, Yayın ve medya, Finans, Saha görevlisi), bir kişiye birden çok rol. Ekip tek listede; Görevler, Çağrı merkezi ve Kiosk kişileri buradan alır. Profilde rol seçici: menü ve tutarlar role göre gizlenir (giriş taklit). Para: kâr, marj ve teklif fiyatını yalnız patron görür; Lojistik tedarikçi fiyatını, Finans tahsilat ve ödemeyi görür; diğerleri tutar görmez. Teklif: Satış onaya gönderir, patron fiyatı onaylamadan dosya çıkmaz. Ana sayfada Benim işlerim ve gelen işler. Görevler ekranına bağlı: görev kendi ekranını açar, bazıları iş bitince kendiliğinden kapanır. Aşama akışı ve devirler Ekip ekranında.'],['UZ-v9','17.11.2026','Etkinlik ekle, düzenle, sil: tür (zirve, B2B, heyet gezisi, konferans, seminer, workshop, lecture; tek veya birleşik), kaynak (özel etkinlik dahil), kullanılacak modüller ve gün akışı şablonu listeden seçilir. Yeni ekran Gün akışı ve oturumlar: toplu açılış, salonlarda paralel oturumlar, B2B, akşam yemeği; şablondan tek tıkla kurulur, salon/saat/tür/konu seçilir, salon çakışması ve kapasite aşımı işaretlenir, kioska aktarılır ve kişinin programına girer. Yeni ekran Rehber ve sağlık güvencesi: grup ve firmaya özel rehber atama, heyet sağlık paketi (gelir, gider, sigorta durumu). Yeni bölüm Finans ve raporlar: Finans (tahsilat, tedarikçi ödemeleri ve avans, hak edişler, verilen teklifler) ve Raporlar (etkinlik raporu iç/müşteri, kârlılık analizi tür/sektör/şehir/kaynak kırılımı, görüşme ve sonuç, finans özeti; 4 dil, PDF ve Excel; müşteriye gönder).'],['UZ-v8','17.11.2026','Dört yeni bölüm. Rıza ve belgeler: her kişinin kişisel veri onayı, fotoğraf/video izni, sözleşme veya teyit ve seyahat sigortası; eksiklere onay linki, toplu hatırlatma, 4 dilde onay metni. Sponsor ve partnerler: paketler, durum, logo yerleri; imzalanan sponsor geliri etkinlik gelir ve kârına eklenir, logolar katalog, bülten ve paylaşım metnine girer. Numune ve kargo: el bagajı veya kargo, gümrük, depo ve masa durumu, sonrası iade/bırak; kargo bedeli gidere. Acil durum: 101/102/103/104, kim aranır, hastane, konsolosluk ve büyükelçilik, senaryo adımları; Kioska aktarınca kioskta Acil durum düğmesi ve Telegram botunda görünür.'],['UZ-v7','17.11.2026','Menü iş akışına göre sıralandı: 1) Satış ve hazırlık: Etkinlikler, Firma evreni, Teklif, Çağrı merkezi, Eşleştirme ve program, Görevler. 2) Lojistik ve gezi: Lojistik, Mekân ve tercüman, Gezi planı. 3) Yayın ve tanıtım: Heyet kataloğu, Telegram bot, Bülten, Medya. 4) Etkinlik günü: Kiosk ve giriş kartı, Etkinlik günü. 5) Sonuç: Sonuç, Pano.'],['UZ-v6','17.11.2026','Görevliler ve görev yerleri: karşılama, ağırlama, B2B yönlendirme, tercüman, kayıt ve saha rolleri; her görevlinin yeri, vardiyası ve görevleri. Görev dağılımı da Kioska aktar ile gider; görevli kartını okutunca kendi görev kartını, herkes Görev panosunu kioskta görür. Yeni menü bölümü Yayın ve tanıtım: Heyet kataloğu (firma logoları, bilgileri, heyet programı; 4 dil, online link ve baskı PDF), Bülten (etkinlik öncesi, günlük ve sonuç sayıları veriden otomatik; online, PDF, e-posta/Telegram/WhatsApp), Medya ve sosyal medya (fotoğraf/video arşivi, kişi izni, Instagram/LinkedIn/Facebook/Telegram için 4 dilde paylaşım, planlama; bağlantı prototipte taklit), Telegram bot (firmalar bota katılır, her firmaya kendi programı kendi dilinde gider; kioska aktarınca değişiklik, sabah programı ve görüşme/transfer hatırlatması otomatik).'],['UZ-v5','17.11.2026','Yeni ekran: Kiosk ve giriş kartı. Ziyaretçi dil seçer, QR kodunu okutur veya firmasını ve adını seçer; giriş kartı kayıt bilgisinden basılır (ad, firma, tür rengi, masa, QR), elle yazılmaz. Kayıt listesi heyet, alıcılar, ekip ve tercümanlardan otomatik oluşur; giriş ve kart durumu anında güncellenir; toplu ön baskı PDF; tam ekran kiosk modu. Kioska aktarım: B2B programı, transfer ve yemek planı, gezi programı bitince Kioska aktar ile gönderilir; program değişirse yeniden aktar uyarısı çıkar; kiosk ziyaretçiye yalnız aktarılmış kendi programını gösterir. Hatırlatma şablonuna QR notu, kart ve kordon gideri gider kalemine eklendi.'],['UZ-v4','17.11.2026','Yeni ekran: Gezi planı. Taşkent, Semerkant, Buhara ve Harezm için görülmesi gereken yerler; 4 standart program (yalnız boş saatler, +1, +2, +3 gün); heyetin günlerine göre gün gün program, yer eklenip çıkarılabilir; Afrosiyob seferleri ve bilet durumu, Harezm için uçak veya gece treni; gezi maliyeti etkinlik giderine yansır; program 4 dilde PDF. Lojistik: anlaşmalı tedarikçiler sekmesi (Oteller, Restoranlar, Ulaşım). Restoranlarda kişi başı fiyat, kapasite, menü dili, yetkili ve rezervasyon linki; yemek planında her öğüne restoran atanır. Ulaşım firmalarında araç tipine göre sefer fiyatı, şoför ve rehber; transfer planında her sefere firma atanır. Yemek ve ulaşım gideri etkinlik giderine, kâra ve teklife otomatik yansır; salon ikramı kahve arasına indirildi.'],['UZ-v3','17.11.2026','Yeni ekranlar: Görevler (aşamaya bağlı, sorumlu, son tarih), Lojistik (uçuş, otel, transfer, davet mektubu; anlaşmalı oteller, Fabriq fiyatı, blok oda, rezervasyon linki), Mekân ve tercüman (salon krokisi, masa ve kiosk yerleri, tercüman havuzu ve atama). Çağrı merkezinde 4 dilde davet, teyit ve hatırlatma şablonları (WhatsApp, Telegram, e-posta). Sonuç ekranında görüşme sonrası anket ve anlaşma ihtimali. Salon, tercüman, otel, transfer, ikram ve baskı giderleri teklife ve etkinlik kârına otomatik yansır.'],['UZ-v2','17.11.2026','Yeni ekran: Çağrı merkezi. Firmaları arayıp teyit alan ve davet eden ekip için arama listesi, durum (aranacak, ulaşılamadı, teyit edildi, davet gönderildi, reddetti), görüşme notu ve sonraki arama. Her firma için tanıtım kartı; kart seçilen dilde PDF olarak gider, kişi verisi karta girmez. 4 dil.'],['UZ-v1','17.11.2026','event360 UZ ayrı ürün olarak açıldı: yalnız sizin ekibiniz kullanır; 8 ekran; 4 dil (TR, UZ, RU, EN); teklif hesabı; kartta gelir/gider/kâr ve tahsilat; dışarıya yalnız dosya gider. Müşavirlik prototipine dokunulmadı.']];

 const cs=getComputedStyle(document.documentElement),c1=cs.getPropertyValue('--rc2').trim(),c2=cs.getPropertyValue('--ok').trim(),c3=cs.getPropertyValue('--rc').trim();
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 const g=(n,cx,col,sp)=>{for(let i=0;i<n;i++){const a=rnd()*6.283,d=Math.pow(rnd(),.6)*sp;x.globalAlpha=.25+rnd()*.6;x.fillStyle=col;x.beginPath();x.arc(cx+Math.cos(a)*d*1.3,r.height/2+Math.sin(a)*d*.8,1+rnd()*2.2,0,6.283);x.fill()}};
 if(flt!=='uz')g(412*.6|0,r.width*.3,c1,r.height*.42);
 if(flt!=='tr')g(1286*.4|0,r.width*.7,c2,r.height*.45);
 if(flt==='all'){x.globalAlpha=.25;x.strokeStyle=c3;for(let i=0;i<26;i++){x.beginPath();x.moveTo(r.width*.3+(rnd()-.5)*90,r.height/2+(rnd()-.5)*120);x.lineTo(r.width*.7+(rnd()-.5)*110,r.height/2+(rnd()-.5)*130);x.stroke()}}
 x.globalAlpha=1;
}

  h:T4('Program aktarılınca katalog, bot ve bülten güncellenir.','Dastur uzatilganda katalog, bot va byulleten yangilanadi.','При передаче программы обновляются каталог, бот и бюллетень.','When the program is pushed, catalogue, bot and newsletter update.'),

  x:e=>T4('Kiosk ziyaretçiye giriş kartı basar, görevli görev panosunu görür; saat saat ajanda izlenir; acil durumda telefonlar, hastane ve konsolosluk bilgisi ile senaryo adımları hazırdır. Telefon numaraları henüz doğrulanmadı.','Kiosk kirish kartasini bosadi, xodim vazifa panelini koʻradi; soat bo‘yicha kun tartibi; favqulodda holatda telefonlar va stsenariy tayyor. Raqamlar hali tasdiqlanmagan.','Киоск печатает пропуск, персонал видит доску задач; посменная повестка; при ЧП готовы телефоны и сценарий. Номера пока не проверены.','The kiosk prints the entry badge, staff see the duty board; the hour-by-hour agenda is tracked; for emergencies phones, hospital, consulate and scenario steps are ready. Phone numbers are not yet verified.'),

  h:T4('Rapor işi yaptıran firmaya verilir; maliyet ve kâr dışarı çıkmaz.','Hisobot buyurtmachiga beriladi; xarajat va foyda tashqariga chiqmaydi.','Отчёт получает заказчик; затраты и прибыль наружу не уходят.','The report goes to the client; cost and profit never leave the house.'),
  x:e=>T4('Görüşme sonrası anket ve anlaşma ihtimali toplanır; gelir, gider, kâr ve tahsilat etkinlik kartında; rapor iç kullanım ve müşteri için PDF/Excel çıkar.','Uchrashuvdan keyin soʻrov va kelishuv ehtimoli; daromad, xarajat, foyda va tushum kartada; hisobot ichki va mijoz uchun PDF/Excel.','После встреч собираются опрос и вероятность сделки; доход, расход, прибыль и поступления в карточке; отчёт для внутреннего и клиентского использования в PDF/Excel.','Post-meeting survey and deal likelihood are collected; income, cost, profit and collection sit on the event card; the report comes as PDF/Excel for internal and client use.'),

  h:T4('Asıl iş bundan sonra başlar: anlaşma 3–12 ayda gelir.','Asosiy ish shundan keyin boshlanadi: kelishuv 3–12 oyda keladi.','Главная работа начинается после: сделки приходят через 3–12 месяцев.','The real work starts here: deals arrive within 3–12 months.'),
